# Checks and deploys the Worker (apps/web) to Cloudflare on every push to main.
# Needs the repository secret CLOUDFLARE_API_TOKEN: a token of the account in wrangler.jsonc with
# the permissions Workers Scripts: Edit and D1: Edit. The Worker's own secrets (AI_GATEWAY_API_KEY,
# AUTH0_*, ...) live in Cloudflare and a deploy keeps them.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @chebot/web build
      - name: Apply D1 migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply chebot --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the Worker
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
